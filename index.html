<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/styles/main.css" />
    <script type="module" src="/src/scripts/main.js"></script>
    <meta
      name="description"
      content="675 agency — брендинговое агентство: айдентика, упаковка и книги. Все работы на одной линии."
    />
    <title>675 agency — брендинговое агентство</title>
  </head>
  <body class="home" data-page="home">
    <header class="site-header">
      <div>
        <h1 class="logo">675 agency</h1>
        <p class="home__tagline">Брендинговое агентство</p>
      </div>
      <nav aria-label="Основное меню">
        <ul class="site-nav">
          <li><a href="/about.html">О нас</a></li>
          <li><a href="/about.html#contact">Связаться</a></li>
        </ul>
      </nav>
    </header>

    <main class="line" data-line>
      <h2 class="visually-hidden">Работы</h2>
      <div class="line__track" data-track aria-hidden="true"></div>
      <div class="spill" data-spill aria-hidden="true"></div>
    </main>

    <footer class="home__footer">
      <nav aria-label="Категории">
        <ul class="filters" data-filters></ul>
      </nav>
      <p class="distance">
        <span data-km>0</span> км из 675
        <span class="distance__hint" data-hint><br />Крутите колесо или тяните линию</span>
      </p>
    </footer>
  </body>
</html>
